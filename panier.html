<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AD CLOTHES - Mon panier</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f3f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #8b5e5e;
        }

        #panier {
            max-width: 700px;
            margin: auto;
        }

        .article-panier {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .article-panier h3 {
            color: #8b5e5e;
            margin-top: 0;
        }

        .article-panier p {
            margin: 7px 0;
        }

        .sous-total {
            font-weight: bold;
            color: #8b5e5e;
        }

        .supprimer {
            background: #c0392b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .supprimer:hover {
            background: #922b21;
        }

        #total {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 18px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .retour,
        .payement {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 11px 22px;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: 0.3s;
        }

        .retour {
            background: #8b5e5e;
        }

        .payement {
            background: #1f1f1f;
        }

        .retour:hover,
        .payement:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            h1 {
                font-size: 25px;
            }

            .article-panier {
                padding: 15px;
            }

            #total {
                font-size: 18px;
            }

            .retour,
            .payement {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

    <h1>🛒 Mon panier</h1>

    <div id="panier"></div>

    <div id="total"></div>

    <a href="Articles.html" class="retour">
        ← Continuer mes achats
    </a>

    <a href="contact.html" class="payement">
        Valider mon panier 🔥➡️
    </a>


    <script>

        let panier = JSON.parse(localStorage.getItem("panier")) || [];


        function afficherPanier() {

            let contenu = document.getElementById("panier");
            let totalElement = document.getElementById("total");

            contenu.innerHTML = "";

            let total = 0;


            if (panier.length === 0) {

                contenu.innerHTML =
                    "<p style='text-align:center;'>Votre panier est vide 🛒</p>";

                totalElement.innerHTML =
                    "Total : 0 FCFA";

                return;
            }


            panier.forEach(function(article, index) {

                let sousTotal =
                    Number(article.prix) * Number(article.quantite);

                total += sousTotal;


                contenu.innerHTML += `

                    <div class="article-panier">

                        <h3>
                            Article ${index + 1}
                        </h3>

                        <p>
                            <strong>Prix :</strong>
                            ${article.prix} FCFA
                        </p>

                        <p>
                            <strong>Taille :</strong>
                            ${article.taille}
                        </p>

                        <p>
                            <strong>Quantité :</strong>
                            ${article.quantite}
                        </p>

                        <p class="sous-total">
                            Sous-total :
                            ${sousTotal} FCFA
                        </p>

                        <button
                            class="supprimer"
                            onclick="supprimerArticle(${index})">

                            Supprimer

                        </button>

                    </div>

                `;

            });


            totalElement.innerHTML =
                "Total : " + total + " FCFA";
        }


        function supprimerArticle(index) {

            panier.splice(index, 1);

            localStorage.setItem(
                "panier",
                JSON.stringify(panier)
            );

            afficherPanier();
        }


        afficherPanier();

    </script>

</body>

</html>
